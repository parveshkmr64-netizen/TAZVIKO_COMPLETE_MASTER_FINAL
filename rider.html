<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAZVIKO Rider</title><style>body{font:15px system-ui;margin:0;background:#f6f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #0000000d}.brand{font-size:26px;font-weight:900}.tag{display:inline-block;background:#172033;color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}.order{border-left:5px solid #ff5a36}.row{display:flex;gap:10px;flex-wrap:wrap}input,button{padding:12px;border:1px solid #cfd5df;border-radius:11px;font:inherit}input{flex:1;min-width:180px}button{background:#172033;color:white;font-weight:800;cursor:pointer}.green{background:#159a68}.orange{background:#ff5a36}.muted{color:#667085}.money{font-size:22px;font-weight:900}.hidden{display:none}a{color:#ff5a36;font-weight:800;text-decoration:none}</style></head><body><div class="wrap"><div class="brand">TAZVIKO Rider</div><div class="muted">Only assigned TAZVIKO orders appear here.</div><div id="login" class="card"><h2>Rider Login</h2><div class="row"><input id="mobile" placeholder="Mobile number"><input id="pin" type="password" placeholder="Rider PIN"><button onclick="doLogin()">Login</button></div><div id="msg" class="muted"></div></div><div id="app" class="hidden"><div class="card"><b id="who"></b> · <a href="#" onclick="logout();return false">Logout</a></div><div id="orders"></div></div></div><script>
let token=localStorage.getItem('tazviko_rider_token')||'';async function req(path,opt={}){const r=await fetch('/api/v1'+path,{headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||r.status);return j}
async function doLogin(){try{const j=await req('/rider/login',{method:'POST',body:JSON.stringify({mobile:mobile.value.trim(),pin:pin.value.trim()})});token=j.token;localStorage.setItem('tazviko_rider_token',token);await boot()}catch(e){msg.textContent='Login failed: '+e.message}}
function logout(){localStorage.removeItem('tazviko_rider_token');token='';app.classList.add('hidden');login.classList.remove('hidden')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function boot(){try{const me=await req('/rider/me');who.textContent=me.rider.full_name+' • '+me.rider.mobile;login.classList.add('hidden');app.classList.remove('hidden');await loadOrders()}catch(e){logout()}}
async function loadOrders(){const j=await req('/rider/orders');orders.innerHTML=j.orders.map(o=>`<div class="card order"><div class="row" style="justify-content:space-between;align-items:center"><span class="tag">TAZVIKO ORDER • ${esc(o.order_code)}</span><b>${esc(o.status)}</b></div><h3>Pickup: ${esc(o.merchant||'Merchant')}</h3><div><b>Customer:</b> ${esc(o.customer_name)} · ${esc(o.mobile)}</div><div><b>Deliver to:</b> ${esc(o.address)}</div><div class="money">${o.payment_method==='COD'?'Collect COD: ₹'+o.total:'Paid online'}</div><div class="row" style="margin-top:12px"><button class="orange" onclick="statusOrder('${esc(o.order_code)}','PICKED_UP')">Picked Up</button><button onclick="statusOrder('${esc(o.order_code)}','ON_THE_WAY')">On The Way</button><button class="green" onclick="statusOrder('${esc(o.order_code)}','DELIVERED')">Delivered</button></div></div>`).join('')||'<div class="card">No assigned TAZVIKO orders right now.</div>'}
async function statusOrder(code,status){try{await req('/rider/orders/'+encodeURIComponent(code)+'/status',{method:'PATCH',body:JSON.stringify({status})});loadOrders()}catch(e){alert(e.message)}}
if(token)boot();setInterval(()=>{if(token)loadOrders().catch(()=>{})},10000);
</script></body></html>
